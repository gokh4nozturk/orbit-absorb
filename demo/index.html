<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>orbit-absorb — interactive demo</title>
	<script>
		// Set theme before first paint to avoid a flash of the wrong theme.
		(function () {
			var stored = localStorage.getItem("theme");
			var dark = stored
				? stored === "dark"
				: matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
		})();
	</script>
	<style>
		* {
			box-sizing: border-box;
		}

		:root {
			--bg: #f7f9fb;
			--panel: #fff;
			--text: #0f172a;
			--text-muted: #475569;
			--text-faint: #64748b;
			--border: #e2e8f0;
			--chip: #eef2f6;
			--accent: #007ce1;
		}

		[data-theme="dark"] {
			--bg: #0b1220;
			--panel: #131c2e;
			--text: #e2e8f0;
			--text-muted: #94a3b8;
			--text-faint: #64748b;
			--border: #28344a;
			--chip: #1c2840;
			--accent: #3b9eff;
		}

		body {
			margin: 0;
			font-family: system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
			transition: background .2s ease, color .2s ease;
		}

		header {
			max-width: 1100px;
			margin: 0 auto;
			padding: 40px 24px 8px;
		}

		h1 {
			font-size: 30px;
			margin: 0;
		}

		h1 code {
			background: var(--chip);
			padding: 2px 10px;
			border-radius: 8px;
		}

		.sub {
			color: var(--text-faint);
			margin: 8px 0 0;
		}

		.links a {
			color: var(--accent);
			text-decoration: none;
			margin-right: 16px;
			font-size: 14px;
		}

		main {
			max-width: 1100px;
			margin: 0 auto;
			padding: 24px;
			display: grid;
			gap: 32px;
			grid-template-columns: 320px 1fr;
			align-items: start;
		}

		.panel {
			background: var(--panel);
			border-radius: 20px;
			padding: 20px;
			box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
			position: sticky;
			top: 24px;
			transition: background .2s ease;
		}

		.row {
			margin-bottom: 16px;
		}

		.row label {
			display: flex;
			justify-content: space-between;
			font-size: 13px;
			font-weight: 600;
			color: var(--text-muted);
			margin-bottom: 6px;
		}

		.row label .val {
			color: var(--accent);
			font-variant-numeric: tabular-nums;
		}

		input[type="range"] {
			width: 100%;
		}

		input[type="color"] {
			width: 100%;
			height: 36px;
			border: none;
			background: none;
			cursor: pointer;
		}

		.toggles {
			display: flex;
			gap: 20px;
		}

		.toggles label {
			font-size: 13px;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			gap: 6px;
			align-items: center;
		}

		.presets {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			margin-top: 4px;
		}

		.presets button {
			border: 1px solid var(--border);
			background: var(--panel);
			color: var(--text);
			border-radius: 999px;
			padding: 6px 12px;
			font-size: 13px;
			cursor: pointer;
		}

		.presets button:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.stage {
			background: var(--panel);
			transition: background .2s ease;
			border-radius: 24px;
			padding: 32px;
			box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
			display: flex;
			justify-content: center;
		}

		orbit-absorb {
			max-width: 460px;
			width: 100%;
		}

		.mark {
			font-weight: 800;
			color: #fff;
			font-size: 24px;
			line-height: 1;
		}

		pre {
			grid-column: 1 / -1;
			background: #0f172a;
			color: #e2e8f0;
			padding: 18px 20px;
			border-radius: 16px;
			overflow-x: auto;
			font-size: 13px;
			margin: 0;
			border: 1px solid transparent;
		}

		[data-theme="dark"] pre {
			border-color: var(--border);
		}

		.theme-toggle {
			margin-left: 4px;
			border: 1px solid var(--border);
			background: var(--panel);
			color: var(--text);
			border-radius: 999px;
			width: 34px;
			height: 34px;
			font-size: 16px;
			line-height: 1;
			cursor: pointer;
			vertical-align: middle;
			transition: border-color .2s ease, background .2s ease;
		}

		.theme-toggle:hover {
			border-color: var(--accent);
		}

		.hint {
			color: var(--accent);
			text-decoration: none;
			font-size: 11px;
			font-weight: 500;
		}

		.hint:hover {
			text-decoration: underline;
		}

		.icon-add {
			display: flex;
			gap: 6px;
			margin-bottom: 8px;
		}

		.icon-add input[type="text"] {
			flex: 1;
			min-width: 0;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text);
			border-radius: 8px;
			padding: 6px 10px;
			font-size: 13px;
		}

		.icon-add input[type="text"]:focus {
			outline: none;
			border-color: var(--accent);
		}

		.icon-add #iconAdd,
		.upload-btn {
			border: 1px solid var(--border);
			background: var(--panel);
			color: var(--text);
			border-radius: 8px;
			padding: 6px 12px;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			white-space: nowrap;
		}

		.icon-add #iconAdd:hover,
		.upload-btn:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.icon-list {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.icon-chip {
			position: relative;
			width: 38px;
			height: 38px;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: var(--bg);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.icon-chip img {
			width: 22px;
			height: 22px;
			object-fit: contain;
		}

		.icon-chip button {
			position: absolute;
			top: -7px;
			right: -7px;
			width: 18px;
			height: 18px;
			border: none;
			border-radius: 50%;
			background: var(--accent);
			color: #fff;
			font-size: 12px;
			line-height: 1;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		@media (max-width: 760px) {
			main {
				grid-template-columns: 1fr;
			}

			.panel {
				position: static;
			}
		}
	</style>
</head>

<body>
	<header>
		<h1><code>&lt;orbit-absorb&gt;</code></h1>
		<p class="sub">Icons revolve, collapse into the center, and re-emerge in a staggered wave. Zero dependencies.</p>
		<p class="links">
			<a href="https://github.com/gokh4nozturk/orbit-absorb">GitHub</a>
			<a href="https://www.npmjs.com/package/orbit-absorb">npm</a>
			<button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
		</p>
	</header>

	<main>
		<div class="panel">
			<div class="row">
				<label>Accent <span class="val" id="accentVal">#007CE1</span></label>
				<input type="color" id="accent" value="#007CE1" />
			</div>
			<div class="row">
				<label>Radius <span class="val" id="radiusVal">140</span></label>
				<input type="range" id="radius" min="80" max="220" value="140" />
			</div>
			<div class="row">
				<label>Icon size <span class="val" id="iconSizeVal">80</span></label>
				<input type="range" id="iconSize" min="40" max="120" value="80" />
			</div>
			<div class="row">
				<label>Rings <span class="val" id="ringsVal">3</span></label>
				<input type="range" id="rings" min="1" max="6" value="3" />
			</div>
			<div class="row">
				<label>Spin (s) <span class="val" id="spinVal">60</span></label>
				<input type="range" id="spin" min="6" max="120" value="60" />
			</div>
			<div class="row">
				<label>Absorb cycle (s) <span class="val" id="absorbVal">7</span></label>
				<input type="range" id="absorb" min="3" max="14" step="0.5" value="7" />
			</div>
			<div class="row">
				<label>Stagger (s) <span class="val" id="staggerVal">0.25</span></label>
				<input type="range" id="stagger" min="0" max="1" step="0.05" value="0.25" />
			</div>
			<div class="row toggles">
				<label><input type="checkbox" id="glow" checked /> Glow</label>
				<label><input type="checkbox" id="emit" checked /> Emit rings</label>
			</div>
			<div class="row">
				<label>Icons <a class="hint" href="https://simpleicons.org" target="_blank" rel="noopener">browse names ↗</a></label>
				<div class="icon-add">
					<input type="text" id="iconInput" placeholder="github, discord or paste a URL" />
					<button type="button" id="iconAdd">Add</button>
					<label class="upload-btn" title="Upload SVG/PNG">
						Upload
						<input type="file" id="iconFile" accept="image/*,.svg" multiple hidden />
					</label>
				</div>
				<div class="icon-list" id="iconList"></div>
			</div>
			<div class="row">
				<label>Presets</label>
				<div class="presets">
					<button data-preset="brand">Brand blue</button>
					<button data-preset="emerald">Emerald</button>
					<button data-preset="fast">Fast</button>
					<button data-preset="calm">Calm</button>
				</div>
			</div>
		</div>

		<div class="stage">
			<orbit-absorb id="oa"><span class="mark">★</span></orbit-absorb>
		</div>

		<pre id="snippet"></pre>
	</main>

	<script type="module">
		import { defineOrbitAbsorb } from "../src/index.ts";
		defineOrbitAbsorb();

		// Theme toggle. The initial data-theme is set by the inline script in <head>.
		const root = document.documentElement;
		const themeBtn = document.getElementById("themeToggle");
		const paintTheme = () => {
			themeBtn.textContent = root.getAttribute("data-theme") === "dark" ? "☀" : "🌙";
		};
		paintTheme();
		themeBtn.addEventListener("click", () => {
			const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
			root.setAttribute("data-theme", next);
			localStorage.setItem("theme", next);
			paintTheme();
			applyIcons();
		});

		const oa = document.getElementById("oa");
		// Icon management. Two kinds of icons live in `iconList`:
		//   { kind: "si", name, light, dark } — Simple Icons slug, theme-aware color
		//   { kind: "url", src }              — a raw URL or data: URL, used as-is
		// Default icons carry explicit light/dark colors so black marks (TikTok, X)
		// stay visible in dark mode. User-added names use the brand color (no override).
		const defaultIcons = [
			{ kind: "si", name: "meta", light: "0866FF", dark: "0866FF" },
			{ kind: "si", name: "tiktok", light: "000000", dark: "e2e8f0" },
			{ kind: "si", name: "snapchat", light: "FFFC00", dark: "FFFC00" },
			{ kind: "si", name: "x", light: "000000", dark: "e2e8f0" },
			{ kind: "si", name: "google", light: "4285F4", dark: "4285F4" },
		];
		let iconList = defaultIcons.map(d => ({ ...d }));

		function resolveIcon(ic) {
			if (ic.kind === "url") return ic.src;
			const color = root.getAttribute("data-theme") === "dark" ? ic.dark : ic.light;
			return color
				? `https://cdn.simpleicons.org/${ic.name}/${color}`
				: `https://cdn.simpleicons.org/${ic.name}`;
		}

		const iconListEl = document.getElementById("iconList");

		function renderIconChips() {
			iconListEl.innerHTML = "";
			iconList.forEach((ic, i) => {
				const chip = document.createElement("div");
				chip.className = "icon-chip";
				const img = document.createElement("img");
				img.src = resolveIcon(ic);
				img.alt = ic.kind === "si" ? ic.name : "icon";
				const rm = document.createElement("button");
				rm.type = "button";
				rm.textContent = "×";
				rm.setAttribute("aria-label", "Remove icon");
				rm.addEventListener("click", () => removeIcon(i));
				chip.append(img, rm);
				iconListEl.appendChild(chip);
			});
		}

		function applyIcons() {
			oa.icons = iconList.map(resolveIcon);
			renderIconChips();
		}

		function removeIcon(i) {
			iconList.splice(i, 1);
			if (iconList.length === 0) iconList = defaultIcons.map(d => ({ ...d }));
			applyIcons();
		}

		function parseToken(tok) {
			tok = tok.trim();
			if (!tok) return null;
			if (/^(https?:|data:)/i.test(tok)) return { kind: "url", src: tok };
			return { kind: "si", name: tok.toLowerCase(), light: null, dark: null };
		}

		function addFromInput() {
			const parts = iconInput.value.split(",").map(parseToken).filter(Boolean);
			if (parts.length) {
				iconList.push(...parts);
				iconInput.value = "";
				applyIcons();
			}
		}

		const iconInput = document.getElementById("iconInput");
		document.getElementById("iconAdd").addEventListener("click", addFromInput);
		iconInput.addEventListener("keydown", e => {
			if (e.key === "Enter") { e.preventDefault(); addFromInput(); }
		});

		const iconFile = document.getElementById("iconFile");
		iconFile.addEventListener("change", () => {
			for (const file of iconFile.files) {
				const reader = new FileReader();
				reader.onload = () => {
					iconList.push({ kind: "url", src: reader.result });
					applyIcons();
				};
				reader.readAsDataURL(file);
			}
			iconFile.value = "";
		});

		applyIcons();

		const attrMap = {
			accent: "accent", radius: "radius", iconSize: "icon-size", rings: "rings",
			spin: "spin-duration", absorb: "absorb-duration", stagger: "stagger",
		};

		function sync() {
			for (const [id, attr] of Object.entries(attrMap)) {
				const el = document.getElementById(id);
				oa.setAttribute(attr, el.value);
				const out = document.getElementById(id + "Val");
				if (out) out.textContent = el.value;
			}
			oa.setAttribute("glow", document.getElementById("glow").checked);
			oa.setAttribute("emit", document.getElementById("emit").checked);
			renderSnippet();
		}

		function renderSnippet() {
			const a = id => document.getElementById(id).value;
			document.getElementById("snippet").textContent =
				`<orbit-absorb
  accent="${a("accent")}"
  radius="${a("radius")}"
  icon-size="${a("iconSize")}"
  rings="${a("rings")}"
  spin-duration="${a("spin")}"
  absorb-duration="${a("absorb")}"
  stagger="${a("stagger")}"
  glow="${document.getElementById("glow").checked}"
  emit="${document.getElementById("emit").checked}">
  <img src="/logo.svg" alt="" width="36" />
</orbit-absorb>`;
		}

		document.querySelectorAll('input[type="range"], input[type="color"], input[type="checkbox"]')
			.forEach(i => i.addEventListener("input", sync));

		const presets = {
			brand: { accent: "#007CE1", radius: 140, iconSize: 80, rings: 3, spin: 60, absorb: 7, stagger: 0.25, glow: true, emit: true },
			emerald: { accent: "#10b981", radius: 120, iconSize: 76, rings: 4, spin: 30, absorb: 6, stagger: 0.2, glow: true, emit: true },
			fast: { accent: "#f43f5e", radius: 150, iconSize: 84, rings: 2, spin: 12, absorb: 4, stagger: 0.15, glow: true, emit: false },
			calm: { accent: "#6366f1", radius: 160, iconSize: 72, rings: 5, spin: 100, absorb: 10, stagger: 0.4, glow: true, emit: true },
		};
		document.querySelectorAll(".presets button").forEach(btn => {
			btn.addEventListener("click", () => {
				const p = presets[btn.dataset.preset];
				for (const [k, v] of Object.entries(p)) {
					const el = document.getElementById(k);
					if (typeof v === "boolean") el.checked = v;
					else el.value = v;
				}
				document.getElementById("accentVal").textContent = p.accent;
				sync();
			});
		});

		sync();
	</script>
</body>

</html>
